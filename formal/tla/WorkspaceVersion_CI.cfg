\* WorkspaceVersion -- CI config (make tla-check).
\* 2 members are mandatory (a torn registration needs a batch of >= 2, same
\* as read skew needing >= 2 artifacts); MaxVersion=3 still admits a peer
\* bump + a registration bump per member; MaxAttempts=1 keeps one full
\* HELD -> re-drive -> exhaustion round. Peer writers are quantifier-
\* anonymous (see WorkspaceVersion.cfg).
SPECIFICATION WVSpec

CONSTANTS
    Members = {m1, m2}
    MaxVersion = 3
    MaxAttempts = 1
    None = None

INVARIANTS
    WVTypeOK
    RegisteredImpliesTerminal
    NoPartialRestoreRegistered
    NoVersionRegression
    ExactlyOnceRegistration
