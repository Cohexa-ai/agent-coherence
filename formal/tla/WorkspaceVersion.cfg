\* WorkspaceVersion -- local deep run.
\* 2 members x MaxVersion=4 x MaxAttempts=2 exercises: every member-class
\* partition (tier + hash are Init-nondeterministic), multi-round HELD
\* re-drive into budget exhaustion, crash/resume at every step, the fence,
\* and the degenerate empty/delete-only/all-absent conclusions.
\* Peer writers are quantifier-anonymous (PeerCommitAction) -- peer identity
\* carries no state in the registration layer, so one action subsumes any
\* number of concurrent registered writers.
SPECIFICATION WVSpec

CONSTANTS
    Members = {m1, m2}
    MaxVersion = 4
    MaxAttempts = 2
    None = None

INVARIANTS
    WVTypeOK
    RegisteredImpliesTerminal
    NoPartialRestoreRegistered
    NoVersionRegression
    ExactlyOnceRegistration
